# @package _global_

# Agents  
agent1: 'Shaper'
agent2: 'PPO_memory'

# Environment
env_id: InTheMatrix
env_type: meta
env_discount: 0.96
payoff: [[[3, 0], [5, 1]], [[3, 5], [0, 1]]]
runner: ipditm_eval
freeze: 5
fixed_coins: True

# Training hyperparameters

# env_batch_size = num_envs * num_opponents
num_envs: 50
num_opps: 1
num_outer_steps: 100
num_inner_steps: 152 
save_interval: 100 

# Evaluation
model_path1: exp/baseline-shaping-Shaper-vs-PPO_memory/run-seed-7/2026-05-04_01.14.41.337020/generation_1600
run_path: lichenqi-university-of-regina/ipditm/p5pgn14f
# welfare:
#   v_ref_shaper: 0.0
#   v_ref_opponent: 0.0

model_path2: False #set to wandb file or False
save_gif: False

# PPO agent parameters
ppo1:
  num_minibatches: 8
  num_epochs: 2 
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.005
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: False # only works with CNN
  hidden_size: 32

ppo2:
  num_minibatches: 8
  num_epochs: 2 
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.005
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True # only works with CNN
  hidden_size: 8

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipditm
  group: 'eval-baseline-${agent1}-vs-${agent2}'
  name: eval-seed-${seed}
  log: True
  mode: online