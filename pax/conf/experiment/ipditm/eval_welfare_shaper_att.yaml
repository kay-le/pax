# @package _global_

# Evaluate a pretrained Welfare Shaper (Attention) vs fresh PPO_memory (InTheMatrix/STORM)
# Freezes the shaper and lets the opponent learn over many episodes.

# Agents
agent1: 'PPO_memory' # WelfareShaperAtt
agent2: 'PPO_memory'

# Environment
env_id: InTheMatrix
env_type: meta
env_discount: 0.96
payoff: [[[3, 0], [5, 1]], [[3, 5], [0, 1]]]
runner: ipditm_eval_welfare
freeze: 5
fixed_coins: False

# Training / Evaluation
num_envs: 50
num_opps: 1
num_outer_steps: 500
num_inner_steps: 152
num_iters: 1               # one trial per job — multi-seed via launcher
save_interval: 100

#seed 3 most unstable multipliers
# run_path: lichenqi-university-of-regina/ipditm/9txfr9et
# model_path: exp/welfare-WelfareShaperAtt-vs-PPO_memory-mean_ref/run-seed-3/2026-04-16_07.44.21.315272/generation_1000
# welfare:
#   v_ref_shaper: 22.44
#   v_ref_opponent: 21.49

#seed 5

# run_path: lichenqi-university-of-regina/ipditm/i4c7pqt8
# model_path: exp/welfare-WelfareShaperAtt-vs-PPO_memory-mean_ref/run-seed-5/2026-04-15_10.56.59.211241/generation_1200
# welfare:
#   v_ref_shaper: 5.56
#   v_ref_opponent: 5.56


#seed 6 best training performance

run_path: lichenqi-university-of-regina/ipditm/d9kmp9yc
model_path: exp/welfare-WelfareShaperAtt-vs-PPO_memory-mean_ref/run-seed-6/2026-04-16_00.32.56.105478/generation_1600
welfare:
  v_ref_shaper: 10.0
  v_ref_opponent: 10.0





# PPO agent parameters (for WelfareShaperAtt = agent1)
ppo1:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.005
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: False
  hidden_size: 32

# PPO agent parameters (for PPO_memory = agent2)
ppo2:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.005
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True
  hidden_size: 8

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipditm
  group: 'eval-welfare-${agent1}-vs-${agent2}'
  name: eval-seed-${seed}
  log: True
  mode: online
