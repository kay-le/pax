# @package _global_

# Constrained-welfare COALA-PG vs paper-style naive A2C learner (IPD)
#
# Same implementation and hyperparameters as coala_pg_v_tabular.yaml, except
# agent1's COALA-PG objective is the Lagrangian welfare objective:
#   r_1 + r_2 + mu_1 * (r_1 - v_ref_shaper)
#             + mu_2 * (r_2 - v_ref_opponent)
#             - rho_k/2 * max(0, v_ref_k - r_k)^2
# The constants and augmented-penalty derivative are folded into per-player
# reward weights, while mu and rho follow the same update rules as the
# constrained welfare ES runner.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg
coala_objective: constrained_welfare

# Save
save: True
save_interval: 1000

# Training
num_envs: 16           # B
num_opps: 8
num_outer_steps: 20    # M
num_inner_steps: 10    # T
num_iters: 3001
num_devices: 1

# Constrained welfare settings.
#
# CHOOSING v_ref. With T=10 the per-episode return range is about -10 (all-CC)
# to -20 (all-DD). The -20 bound is mostly a sanity check because it usually
# leaves the constraint inactive; -15 is a hard ablation and has shown strong
# seed bimodality. Use -17.5 as the default sweep midpoint: it binds more often
# than -20 without immediately forcing the dual loop into the unstable regime.
welfare:
  rho1: 1.0
  rho2: 1.0
  rho_schedule: 1.5
  rho_patience: 30
  # rho must stay O(1 + mu), or the penalty term dominates and the weight ratio
  # saturates against weight_ratio_max in EVERY episode -- which erases the
  # per-episode variation that `slack_per_episode` exists to create. Checked
  # against a measured run (violations 1.2-5.1, mu=(2.0, 1.75)):
  #   rho=10, 5  -> raw ratio 3.3-19.7, clipped flat at 3.0 in every episode
  #   rho=2      -> raw ratio 2.0-4.8, informative in the first half
  #   rho=1      -> raw ratio 1.5-3.0, informative throughout
  # rho has ratcheted to its ceiling in every run so far, so this ceiling is
  # what actually governs; keep it low.
  rho_max: 2.0
  mu1: 0.0
  mu2: 0.0
  # Keep the dual loop slower than the PPO loop. Faster dual updates were useful
  # for debugging windup, but make seed-to-seed bimodality worse at tight bounds.
  dual_lr: 0.002
  calibration: False      # not implemented for runner=coala_pg; must be False
  v_ref_shaper: -17.5
  v_ref_opponent: -17.5

  # PG-specific safeguards. `runner_welfare_evo` needs none of these: ES has no
  # critic, so a uniform rescaling of its Lagrangian fitness is absorbed by
  # Adam. Here the Lagrangian enters as a reward weight, so an unbounded weight
  # is an unbounded reward scale feeding a critic that regresses undiscounted
  # returns over M*T steps. All three are no-ops whenever the constraints are
  # slack (mu=0, w=(1,1)), so they cannot change the -20.0 result above.
  mu_max: 2.0               # cap the dual variable; stops integrator windup
                            # and keeps the unwind time ~400 iterations at the
                            # dual_lr above
  # Bound the player-to-player weight RATIO, which is the only part of the
  # Lagrangian that normalization passes through to the policy. Both extremes
  # were measured at v_ref=(-15,-15) and each deletes half the objective:
  #   raw cap of 10   -> both weights pin at the cap, ratio -> 1:1, the penalty
  #                      carries no information and this is just welfare
  #                      (that run drifted to the all-defect basin);
  #   no cap          -> rho*max(0,-s) is unbounded in the violation, so a
  #                      ONE-SIDED violation (shaper -2.8, co-player +1.1) ran
  #                      the ratio to 11.2:1 (w = 30.9 vs 2.75), i.e. an
  #                      effectively selfish objective with no welfare term.
  # 5.0 is a middle ground: 3.0 can make the constraint too weak, while no cap
  # can turn a one-sided violation into an effectively selfish objective.
  weight_ratio_max: 5.0
  weight_max: 10.0          # hard cap on 1 + mu + rho*max(0,-s). IGNORED when
                            # weight_normalization is True (ratio clipping above
                            # supersedes it); applies only on the un-normalized
                            # path, where it is the sole scale protection
  weight_normalization: True  # divide the reward stream by the mean weight, so
                              # the critic sees a stationary target scale and
                              # only the player-to-player weight RATIO (the
                              # actual Lagrangian direction) reaches the policy
  slack_per_episode: False  # faithful constrained objective: one constraint
                            # slack from the whole meta-trajectory return.
                            # True is a stabilizing heuristic ablation, not the
                            # exact constrained-welfare objective.

# COALA-PG shaper (agent1), constrained welfare objective.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2): A2C settings from Table 8 of the paper.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'constrained-welfare-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
