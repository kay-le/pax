# @package _global_

# Constrained-welfare COALA-PG vs paper-style naive A2C learner (IPD)
#
# Same implementation and hyperparameters as coala_pg_v_tabular.yaml, except
# agent1's COALA-PG objective is the Lagrangian welfare objective:
#   r_1 + r_2 + mu_1 * (r_1 - v_ref_shaper)
#             + mu_2 * (r_2 - v_ref_opponent)
#             - rho_k/2 * max(0, v_ref_k - r_k)^2
# The constants and augmented-penalty derivative are folded into per-player
# reward weights, while mu and rho follow the same update rules as the
# constrained welfare ES runner.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg
coala_objective: constrained_welfare

# Save
save: True
save_interval: 1000

# Training
num_envs: 16           # B
num_opps: 8
num_outer_steps: 20    # M
num_inner_steps: 10    # T
num_iters: 3001
num_devices: 1

# Constrained welfare settings.
#
# CHOOSING v_ref. With T=10 the per-episode return range is about -10 (all-CC)
# to -20 (all-DD), so v_ref must sit strictly inside that band to bind:
#   -20.0  the constraint never activates. Measured: mu stayed at 0.0 for all
#          3000 iterations and slack was +5 to +9, i.e. the run was plain
#          welfare COALA-PG (w = (1,1)) with dead constraint machinery. It
#          converged well (CC 0.99, DD 0.02, welfare -25.6).
#   -15.0  infeasible for the shaper: its meta-mean averages over the early
#          inner episodes where the freshly initialised co-player still
#          defects, so -1.5/step is unreachable at M=20. Measured: mu1 wound
#          up to 50 and rho1 pinned at rho_max, and the policy went
#          uniform-random (cooperation probability 0.20 at every state).
#   -17.0  the binding region. Sweep -18 / -17 / -16 for the frontier.
welfare:
  rho1: 1.0
  rho2: 1.0
  rho_schedule: 1.5
  rho_patience: 30
  rho_max: 50
  mu1: 0.0
  mu2: 0.0
  dual_lr: 0.002
  calibration: False      # not implemented for runner=coala_pg; must be False
  v_ref_shaper: -15.0
  v_ref_opponent: -15.0

  # PG-specific safeguards. `runner_welfare_evo` needs none of these: ES has no
  # critic, so a uniform rescaling of its Lagrangian fitness is absorbed by
  # Adam. Here the Lagrangian enters as a reward weight, so an unbounded weight
  # is an unbounded reward scale feeding a critic that regresses undiscounted
  # returns over M*T steps. All three are no-ops whenever the constraints are
  # slack (mu=0, w=(1,1)), so they cannot change the -20.0 result above.
  mu_max: 5.0               # cap the dual variable; stops integrator windup
  #
  # WARNING -- rho_max 50 and slack_per_episode False are incompatible.
  # With a single scalar slack, w_k = 1 + mu_k + rho*max(0,-s_k) exceeds
  # weight_max for BOTH players as soon as both violate by more than ~0.04, so
  # both clip to weight_max, the ratio becomes exactly 1:1, and after
  # normalization the objective is plain welfare -- the constraint is erased.
  # Swept over an (s1,s2) grid of +-4 at mu=(5,5), the fraction of the grid
  # where the ratio collapses to 1:1 is:
  #     rho_max=50 -> 88.9%     rho_max=10 -> 78.5%
  #     rho_max=2  -> 30.8%     rho_max=1  ->  5.9%
  # rho_max=50 survived in the best measured run ONLY because
  # slack_per_episode was True there: per-episode variation meant some
  # episodes escaped the clip. With False, set rho_max to 1.0 (i.e. no
  # ratcheting above rho1) or raise weight_max instead. Left at 50 here
  # because the rollback target asked for it -- change one or the other
  # before trusting a run from this config.
  weight_max: 10.0          # hard cap on 1 + mu + rho*max(0,-s)
  weight_normalization: True  # divide the reward stream by the mean weight, so
                              # the critic sees a stationary target scale and
                              # only the player-to-player weight RATIO (the
                              # actual Lagrangian direction) reaches the policy
  # FAITHFUL constrained objective: one slack from the whole meta-trajectory
  # return, matching the Lagrangian this variant claims to optimize. True
  # resolves the slack per inner episode so the quadratic penalty varies along
  # M (the way the ES penalty varies across population members) -- that is a
  # stabilizing heuristic, not the stated objective, and it is what the best
  # measured run used (welfare -26.6, CC 0.90). Kept False deliberately: the
  # exact objective matters more here than matching that one seed, so these
  # hyperparameters are no longer the ones that produced it.
  slack_per_episode: False

# COALA-PG shaper (agent1), constrained welfare objective.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2): A2C settings from Table 8 of the paper.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'constrained-welfare-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
