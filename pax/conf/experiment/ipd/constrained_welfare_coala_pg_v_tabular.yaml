# @package _global_

# Constrained-welfare COALA-PG vs paper-style naive A2C learner (IPD)
#
# Same implementation and hyperparameters as coala_pg_v_tabular.yaml, except
# agent1's COALA-PG objective is the Lagrangian welfare objective:
#   r_1 + r_2 + mu_1 * (r_1 - v_ref_shaper)
#             + mu_2 * (r_2 - v_ref_opponent)
#             - rho_k/2 * max(0, v_ref_k - r_k)^2
# The constants and augmented-penalty derivative are folded into per-player
# reward weights, while mu and rho follow the same update rules as the
# constrained welfare ES runner.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg
coala_objective: constrained_welfare

# Save
save: True
save_interval: 1000

# Training
num_envs: 16           # B
num_opps: 8
num_outer_steps: 20    # M
num_inner_steps: 10    # T
num_iters: 3001
num_devices: 1

# Constrained welfare settings.
#
# CHOOSING v_ref. With T=10 the per-episode return range is about -10 (all-CC)
# to -20 (all-DD), so v_ref must sit strictly inside that band to bind:
#   -20.0  sits on the all-DD boundary, so the constraint never activates.
#          Measured: mu stayed at 0.0 for all 3000 iterations with slack +5 to
#          +9 -- the run was plain welfare COALA-PG (w = (1,1)) with dead
#          constraint machinery. It converged well (CC 0.99, welfare -25.6).
#   -15.0  binds, and is FEASIBLE. Measured post-fix: one seed reached slack
#          +1.32 / +2.06 with CC cooperation 0.90 and welfare -26.6, while
#          another at identical settings drifted into the all-defect basin
#          (slack -1.9 / -4.5, CC 0.31, welfare -36.3). That spread is the
#          usual shaper-vs-naive bimodality, NOT infeasibility -- budget
#          several seeds here rather than more iterations on one.
#          (Pre-fix, this same threshold produced a uniform-random policy:
#          cooperation probability 0.20 at every state. See the safeguards
#          below.)
welfare:
  rho1: 1.0
  rho2: 1.0
  rho_schedule: 1.5
  rho_patience: 30
  # rho_max 50 was far too aggressive: at slack=-2 the penalty term is 100,
  # which dwarfs (1 + mu) and drives both weights to the same saturating value,
  # so the player-to-player ratio -- the only thing normalization passes to the
  # policy -- collapses to 1:1. Measured: rho pinned at 50 for both players in
  # every run so far.
  rho_max: 10
  mu1: 0.0
  mu2: 0.0
  # DUAL RESPONSIVENESS. mu must be able to unwind within the run, or the
  # primal-dual loop degenerates into a pure integrator: at mu_max=5 and
  # dual_lr=0.002 an unwind takes ~2500 iterations, and a measured run sat at
  # mu=4.94 with BOTH constraints already satisfied (+1.3 / +2.1), still paying
  # a multiplier it earned thousands of iterations earlier. Keep
  # mu_max / dual_lr ~ a few hundred iterations.
  dual_lr: 0.005
  calibration: False      # not implemented for runner=coala_pg; must be False
  v_ref_shaper: -15.0
  v_ref_opponent: -15.0

  # PG-specific safeguards. `runner_welfare_evo` needs none of these: ES has no
  # critic, so a uniform rescaling of its Lagrangian fitness is absorbed by
  # Adam. Here the Lagrangian enters as a reward weight, so an unbounded weight
  # is an unbounded reward scale feeding a critic that regresses undiscounted
  # returns over M*T steps. All three are no-ops whenever the constraints are
  # slack (mu=0, w=(1,1)), so they cannot change the -20.0 result above.
  mu_max: 2.0               # cap the dual variable; stops integrator windup
                            # and keeps the unwind time ~400 iterations at the
                            # dual_lr above
  weight_max: 10.0          # hard cap on 1 + mu + rho*max(0,-s). IGNORED when
                            # weight_normalization is True, which already bounds
                            # the effective weights (w1 + w2 == 2 exactly);
                            # capping before normalizing only distorts the ratio
  weight_normalization: True  # divide the reward stream by the mean weight, so
                              # the critic sees a stationary target scale and
                              # only the player-to-player weight RATIO (the
                              # actual Lagrangian direction) reaches the policy
  slack_per_episode: True   # resolve the slack per inner episode, not once per
                            # meta-trajectory, so the quadratic penalty varies
                            # along M the way the ES penalty varies across
                            # population members

# COALA-PG shaper (agent1), constrained welfare objective.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2): A2C settings from Table 8 of the paper.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'constrained-welfare-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
