# @package _global_

# EVALUATION of a trained one-head WELFARE COALA-PG shaper against a fresh
# naive A2C learner.
#
# This matches checkpoints trained with welfare_coala_pg_v_tabular.yaml:
# agent1 is CoalaPG with one value head. Do not use the Lagrangian eval config
# for these checkpoints; that config expects the three-head CoalaPGLagrangian
# parameter tree.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: welfare_eval
coala_objective: welfare

resume_dir: ""

# Eval geometry -- must match welfare_coala_pg_v_tabular.yaml.
num_envs: 16
num_opps: 1
num_outer_steps: 20
num_inner_steps: 10
num_iters: 1
num_devices: 1

# Edit model_path before launching eval.
run_path: lichenqi-university-of-regina/ipd
model_path: "SET_ME"

# Seed-specific checkpoints pulled from W&B. If present, the eval runner
# selects checkpoints[str(checkpoint_seed or seed)] and overrides the
# run_path/model_path defaults above.
checkpoints:
  '14012':
    run_path: lichenqi-university-of-regina/ipd/a4hxd967
    model_path: exp/64unconstrained-CoalaPG-vs-CoalaA2C/run-seed-14012/2026-10-06_14.44.58.030115/iteration_5000
    max_iteration: 5000
  '24343':
    run_path: lichenqi-university-of-regina/ipd/iy14jc03
    model_path: exp/64unconstrained-CoalaPG-vs-CoalaA2C/run-seed-24343/2026-10-06_14.45.23.244760/iteration_5000
    max_iteration: 5000
  '67655':
    run_path: lichenqi-university-of-regina/ipd/fc041sor
    model_path: exp/64unconstrained-CoalaPG-vs-CoalaA2C/run-seed-67655/2026-10-06_14.45.09.137944/iteration_5000
    max_iteration: 5000

# IR reference values for eval reporting only.
welfare:
  # Matched to the CONSTRAINED condition's training floors (-20 shaper,
  # -17.5 co-player) and identical in all three eval configs, so the logged
  # slack is directly comparable across selfish / welfare / constrained.
  # Raw returns are logged too (eval/per_episode/reward/player_{1,2}), so any
  # other yardstick can be applied afterwards -- slack is just return - v_ref.
  #
  # -20 is each player's security level (mutual defection at T=10); -17.5 is
  # 2.5 above the co-player's, so co-player slack >= 0 is a STRONGER claim
  # than individual rationality. Say which you mean when reporting.
  v_ref_shaper: -20.0
  v_ref_opponent: -17.5

# Shaper (agent1) -- architecture keys must match training.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2), matching training.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  # 0.0, matching TRAINING and the other two eval configs. The co-player
  # LEARNS during eval -- it is the agent being shaped -- so its exploration
  # must be identical to training (or the eval measures a different learner
  # than the one the shaper was trained against) and identical across the
  # three conditions (or the conditions are not comparable). This was 0.02,
  # inherited from a slip in the training config that has since been fixed.
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'eval-welfare-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: online
