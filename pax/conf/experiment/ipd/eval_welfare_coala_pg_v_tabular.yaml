# @package _global_

# EVALUATION of a trained UNCONSTRAINED WELFARE COALA-PG shaper,
#
# specifically the CONTROLLED-ABLATION form of the welfare baseline, trained as
#
#   lagrangian_coala_pg_v_tabular  ++welfare.freeze_lam=True ++welfare.lam_init=0.0
#
# i.e. the SAME agent, runner and critic architecture as the constrained
# condition, with the multipliers frozen at zero so the objective is exactly
# r_s + r_o. That is why agent1 is CoalaPGLagrangian here and not CoalaPG: the
# checkpoint's network has THREE value heads (welfare + two constraint heads,
# the latter trained but unused at lam=0), and loading it under a single-head
# agent fails on a parameter-tree mismatch.
#
# If you instead want to evaluate a checkpoint from `welfare_coala_pg_v_tabular`
# (the standalone welfare config, agent1 CoalaPG, ONE value head), add:
#   ++agent1=CoalaPG
# The CoalaPG factory ignores the welfare block, so that single override is
# the whole difference.
# against a FRESH naive A2C learner. Same protocol as
# eval_shaper_att_v_tabular.yaml / eval_welfare_shaper_att_v_tabular.yaml:
# load frozen shaper params, re-initialise the co-player, let the co-player
# learn for num_outer_steps episodes, and log per-episode returns, welfare and
# IR slack so the CONVERGED behaviour (last few episodes) can be read off.
#
# One trial per job; the statistical sample comes from running many seeds.
#
# THE EVAL GEOMETRY MUST MATCH TRAINING. num_inner_steps (T) is load-bearing:
# the shaper is a GRU that conditions on the whole learning trace, so it has
# only ever seen T=10 episodes and M=20 of them. Changing T at eval evaluates
# it off-distribution. num_envs (B) is the co-player's minibatch, so it governs
# how fast the co-player learns and must match too. Raising M above 20 is a
# legitimate but DIFFERENT experiment (extrapolation past the training
# horizon) -- say so if you report it.

# Agents
agent1: 'CoalaPGLagrangian'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: welfare_eval

resume_dir: ""

# Eval geometry -- identical to lagrangian_coala_pg_v_tabular.yaml
num_envs: 16           # B, the co-player's minibatch
num_opps: 8            # 8 independent fresh co-players per job
num_outer_steps: 20    # M, inner episodes the co-player gets to learn
num_inner_steps: 10    # T, MUST match training
num_iters: 1           # one trial per job -- sample across seeds
num_devices: 1

# At eval the shaper is frozen, so neither the objective nor the dual
# controller runs; the keys below are provenance only. What DOES matter is the
# critic shape, which comes from agent1 plus the welfare block.
coala_objective: welfare

# ---- which checkpoint to evaluate ----
#
# Training writes to  <hydra.run.dir>/exp/<wandb.group>/<wandb.name>/<timestamp>/iteration_<N>
# and the launcher copies that tree to
#   /scratch/lichenqi/results/B9_lagrangian_coala_pg_v_tabular_seed<SEED>/
#
# so a concrete model_path looks like:
#   /scratch/lichenqi/results/B9_lagrangian_coala_pg_v_tabular_seed1401/lagrangian-COALA-PG-CoalaPGLagrangian-vs-CoalaA2C/run-seed-1401/<timestamp>/iteration_3000
#
# Override it per job rather than editing this file:
#   ++model_path=/scratch/.../iteration_3000
#
# run_path is only used by wandb.restore, which is skipped in offline mode and
# for absolute model_paths -- leave it unless you are restoring from wandb.
run_path: lichenqi-university-of-regina/ipd
model_path: "SET_ME"

# IR reference values. -20.0 is each player's security level (the
# mutual-defection payoff at T=10), which makes the logged slack exactly the
# individual-rationality margin. Keep these equal to the training values so
# eval slack and training slack mean the same thing.
#
# Two jobs. (1) The eval runner reports IR slack against these reference
# values -- the whole point of evaluating this condition is how far below its
# security level the unconstrained welfare shaper ends up, measured on the
# SAME yardstick as the constrained condition. (2) `constrain_*` determine how
# many constraints exist, hence how many critic heads the network has
# (1 welfare + one per constraint). They MUST match training even though no
# constraint is enforced here: the frozen-lam checkpoint was trained with both
# present, so the network needs 3 value heads to load.
#
# freeze_lam / lam_init are inert at eval (no dual update runs) and are
# recorded only to document which training form this config targets.
welfare:
  v_ref_shaper: -20.0
  v_ref_opponent: -20.0
  constrain_shaper: True
  constrain_opponent: True
  freeze_lam: True
  lam_init: 0.0

# Shaper (agent1) -- architecture keys must match training or the checkpoint
# will not load. hidden_size is the load-bearing one.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2) -- A2C settings from Table 8 of the paper, matching
# training. This agent DOES learn during eval; that is the point.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'eval-welfare-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
