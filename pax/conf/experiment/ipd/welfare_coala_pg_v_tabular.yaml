# @package _global_

# One-head welfare COALA-PG vs paper-style naive A2C learner (IPD).
#
# This is the direct unconstrained welfare ablation of the selfish COALA-PG
# baseline: same CoalaPG agent, same single value head, same runner, same
# optimizer and same rollout geometry. The only change is the meta-agent's
# update reward:
#
#   selfish baseline: r_s
#   welfare version : r_s + r_o
#
# This is intentionally NOT the frozen-lambda Lagrangian variant, which uses a
# three-head CoalaPGLagrangian network. Use this config when you want the
# comparison to isolate objective only while keeping the original one-head
# COALA-PG architecture.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg
coala_objective: welfare

# Save
save: True
save_interval: 1000

# Training geometry, identical to coala_pg_v_tabular.yaml.
num_envs: 16           # B
num_opps: 64           # must match the other conditions (see coala_pg_v_tabular.yaml)
num_outer_steps: 20    # M
num_inner_steps: 10    # T
num_iters: 5001
num_devices: 1

# COALA-PG shaper (agent1), identical to the selfish one-head baseline.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  # 0.02, matching every other shaper agent in this repo AND the other two
  # COALA-PG objectives. Departs from the paper's Table 8 value of 0.0
  # deliberately: at 0.0 the softmax saturates and the policy dies (measured
  # P(coop) = 0.000 at every state), and it MUST be identical across the
  # selfish / welfare / constrained conditions or a difference in outcome is
  # attributable to exploration rather than to the objective.
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2): A2C settings from Table 8 of the paper.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  # 0.0, from the paper's Table 8. The CO-PLAYER must be identical in all
  # three conditions -- it is the agent being shaped, so changing it changes
  # the thing being measured. This was 0.02 here and 0.0 in the other two
  # configs, which made the welfare condition shape a different learner.
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'welfare-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
