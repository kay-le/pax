# @package _global_

# COALA-PG vs Tabular naive learner (IPD)
#
# Baseline reimplementation of:
#   Meulemans et al. (2025), "Multi-agent cooperation through learning-aware
#   policy gradients", ICLR 2025 (arXiv:2410.18636).
#
# Shape semantics for this runner (the paper's batched co-player shaping POMDP):
#   num_envs        = B, the lockstep batch each co-player learns from
#   num_outer_steps = M, inner episodes per meta-trajectory
#   num_inner_steps = T, steps per inner episode
#   num_opps        = independent replicas of the construction
#   num_iters       = number of meta-trajectories (i.e. COALA-PG updates)
#
# B must be > 1: the whole estimator rests on averaging future-episode credit
# across the co-player's minibatch, which is degenerate at B = 1.
#
# PPO batch per update = M * T * num_opps * num_envs
#                      = 16 * 100 * 4 * 16 = 102,400  (divisible by 8)

# Agents
agent1: 'CoalaPG'
agent2: 'Tabular'      # naive learner, matching the shaper-vs-naive comparison

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg

# Save
save: True
save_interval: 200

# Training
num_envs: 16           # B
num_opps: 4
num_outer_steps: 16    # M
num_inner_steps: 100   # T
num_iters: 2001
num_devices: 1

# COALA-PG shaper (agent1).
# NOTE: learning_rate here is a real PG step size, unlike the ES-trained
# Shaper/M-FOS configs where ppo1.learning_rate is inert. Expect to tune
# learning_rate, M and B; the paper's IPD hyper-parameters are not reported in
# a directly transferable form.
ppo1:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 16

# Naive co-player (agent2) — identical to the other IPD baselines so the
# comparison is like-for-like.
ppo2:
  num_minibatches: 4
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 1
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 16

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'baseline-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
  