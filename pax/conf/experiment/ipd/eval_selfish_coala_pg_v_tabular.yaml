# @package _global_

# EVALUATION of a trained SELFISH COALA-PG shaper (the paper baseline),
# against a FRESH naive A2C learner. Same protocol as
# eval_shaper_att_v_tabular.yaml / eval_welfare_shaper_att_v_tabular.yaml:
# load frozen shaper params, re-initialise the co-player, let the co-player
# learn for num_outer_steps episodes, and log per-episode returns, welfare and
# IR slack so the CONVERGED behaviour (last few episodes) can be read off.
#
# One trial per job; the statistical sample comes from running many seeds.
#
# THE EVAL GEOMETRY MUST MATCH TRAINING. num_inner_steps (T) is load-bearing:
# the shaper is a GRU that conditions on the whole learning trace, so it has
# only ever seen T=10 episodes and M=20 of them. Changing T at eval evaluates
# it off-distribution. num_envs (B) is the co-player's minibatch, so it governs
# how fast the co-player learns and must match too. Raising M above 20 is a
# legitimate but DIFFERENT experiment (extrapolation past the training
# horizon) -- say so if you report it.

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: welfare_eval

resume_dir: ""

# Eval geometry -- identical to lagrangian_coala_pg_v_tabular.yaml
num_envs: 16           # B, the co-player's minibatch
num_opps: 1            # one fresh co-player per job; sample across seeds
num_outer_steps: 20    # M, inner episodes the co-player gets to learn
num_inner_steps: 10    # T, MUST match training
num_iters: 1           # one trial per job -- sample across seeds
num_devices: 1


# ---- which checkpoint to evaluate ----
#
# Training writes to  <hydra.run.dir>/exp/<wandb.group>/<wandb.name>/<timestamp>/iteration_<N>
# and the launcher copies that tree to
#   /scratch/lichenqi/results/B9_coala_ipd_seed<SEED>/
#
# so a concrete model_path looks like:
#   /scratch/lichenqi/results/B9_coala_ipd_seed1401/baseline-COALA-PG-CoalaPG-vs-CoalaA2C/run-seed-1401/<timestamp>/iteration_3000
#
# Override it per job rather than editing this file:
#   ++model_path=/scratch/.../iteration_3000
#
# run_path is only used by wandb.restore, which is skipped in offline mode and
# for absolute model_paths -- leave it unless you are restoring from wandb.
run_path: lichenqi-university-of-regina/ipd
model_path: "SET_ME"

# Seed-specific checkpoints pulled from W&B. If present, the eval runner
# selects checkpoints[str(checkpoint_seed or seed)] and overrides the
# run_path/model_path defaults above.
checkpoints:
  '13992':
    run_path: lichenqi-university-of-regina/ipd/2g027z2l
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-13992/2026-10-06_22.13.56.269408/iteration_5000
    max_iteration: 5000
  '14002':
    run_path: lichenqi-university-of-regina/ipd/832kmcjc
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-14002/2026-10-06_22.13.56.273932/iteration_5000
    max_iteration: 5000
  '14012':
    run_path: lichenqi-university-of-regina/ipd/p6bw6bw8
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-14012/2026-10-06_22.13.56.274197/iteration_5000
    max_iteration: 5000
  '24343':
    run_path: lichenqi-university-of-regina/ipd/tmo49q2v
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-24343/2026-10-06_22.13.56.396358/iteration_5000
    max_iteration: 5000
  '44545':
    run_path: lichenqi-university-of-regina/ipd/76w65wqr
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-44545/2026-10-06_22.13.56.269828/iteration_5000
    max_iteration: 5000
  '67655':
    run_path: lichenqi-university-of-regina/ipd/s6rqjjwh
    model_path: exp/128selfish-CoalaPG-vs-CoalaA2C/run-seed-67655/2026-10-06_22.13.56.356407/iteration_5000
    max_iteration: 5000

# Reference values for eval slack. These match the constrained COALA-PG
# training floors so eval slack is directly comparable across selfish /
# welfare / constrained. Raw returns are logged too, so other reference
# values can be applied afterwards.
#
# This agent has no constraints; the block exists only so the eval runner can
# report slack on the SAME reference values as the other two conditions.
# For the selfish shaper the interesting slack is the CO-PLAYER's: a selfish
# shaper that exploits drives R_o down toward the co-player's security level
# (-20, mutual defection at T=10), i.e. well below the -15 floor used here, so
# expect a strongly negative slack_opponent. Note -15 is NOT the security
# level: slack >= 0 against it is a stricter condition than individual
# rationality.
welfare:
  v_ref_shaper: -15.0
  v_ref_opponent: -15.0

# Shaper (agent1) -- architecture keys must match training or the checkpoint
# will not load. hidden_size is the load-bearing one.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2) -- A2C settings from Table 8 of the paper, matching
# training. This agent DOES learn during eval; that is the point.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'eval-selfish-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: online
